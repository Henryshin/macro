<html lang="ko">

<title>경제지표 — 금리와 코스피 수급</title>
<style>
  :root { color-scheme: light; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body{
    --page:#faf9f5; --card:#ffffff; --card2:#f5f4ee;
    --ink:#201f1d; --ink2:#5d5a51; --mut:#8f8d84;
    --grid:#e9e7df; --line:rgba(32,31,29,.10);
    --blue:#1257c8; --orange:#e8720c; --dark:#4a4844; --gray:#a8a69d; --blue-l:#8fb4ea;
    background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    line-height:1.6;
  }
  .wrap{ max-width:1060px; margin:0 auto; padding:44px 20px 80px; }
  h1{ font-size:1.65rem; font-weight:800; letter-spacing:-.015em; text-wrap:balance; }
  .sub{ color:var(--ink2); margin-top:8px; max-width:66ch; }
  .meta{ color:var(--mut); font-size:.79rem; margin-top:12px; letter-spacing:.03em; }

  .crumb{ color:var(--mut); font-size:.8rem; margin-bottom:9px; }
  .crumb a{ color:var(--ink2); text-decoration:none; font-weight:600; }
  .crumb a:hover{ color:var(--blue); text-decoration:underline; }
  .crumb a:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; border-radius:3px; }

  .tabs{ display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin:28px 0 0; border-bottom:1px solid var(--line); }
  .tabs button{ font:inherit; font-size:.93rem; font-weight:650; color:var(--mut);
    background:none; border:0; border-bottom:2.5px solid transparent; padding:10px 16px;
    cursor:pointer; margin-bottom:-1px; }
  .tabs button:hover{ color:var(--ink2); }
  .tabs button[aria-selected="true"]{ color:var(--blue); border-bottom-color:var(--blue); }
  .tabs button:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; border-radius:4px 4px 0 0; }
  [role="tabpanel"][hidden]{ display:none; }

  .pagesel{ margin-top:14px; display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
  .pagesel select{ font:inherit; font-size:.88rem; font-weight:650; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 30px 7px 12px;
    cursor:pointer; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
    background-position:calc(100% - 15px) 51%,calc(100% - 10px) 51%;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  .pagesel select:hover{ border-color:var(--mut); }
  .pagesel select:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }

  .pagesel button{ font:inherit; font-size:.88rem; font-weight:650; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:7px 13px; cursor:pointer; }
  .pagesel button:hover:not(:disabled){ border-color:var(--mut); background:var(--card2); }
  .pagesel button:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .pagesel button:disabled{ color:var(--mut); cursor:default; }
  .pagesel .at{ font-size:.79rem; color:var(--mut); font-variant-numeric:tabular-nums; }
  .pagesel .at.err{ color:var(--orange); }

  
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));
    gap:18px; margin-top:26px; }
  .card{ display:flex; flex-direction:column; background:var(--card);
    border:1px solid var(--line); border-radius:12px;
    padding:22px 24px 20px; text-decoration:none; color:inherit; }
  .card:hover{ border-color:var(--mut); }
  .card:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .card h2{ font-size:1.05rem; font-weight:700; display:flex; align-items:center; gap:8px; }
  .card h2::after{ content:'→'; color:var(--mut); font-weight:400; }
  .card.ext h2::after{ content:'↗'; }
  .card .why{ color:var(--ink2); font-size:.86rem; margin-top:5px; }
  
  .card .big{ font-size:1.55rem; font-weight:800; margin-top:auto; padding-top:16px;
    letter-spacing:-.015em; }
  .card .sub3{ color:var(--mut); font-size:.79rem; margin-top:3px; }
  
  .card .why + .sub3{ margin-top:auto; padding-top:16px; }
  .card .sub3 .pos, .card .sub3 .neg{ font-weight:700; }
  footer{ color:var(--mut); font-size:.78rem; margin-top:26px; }

  .tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:12px; margin:24px 0 4px; }
  .tile{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:15px 17px; }
  .tile .k{ font-size:.75rem; color:var(--mut); letter-spacing:.05em; }
  .tile .v{ font-size:1.45rem; font-weight:750; margin-top:3px; font-variant-numeric:tabular-nums; letter-spacing:-.015em; }
  .tile .d{ font-size:.77rem; color:var(--ink2); margin-top:1px; }
  .pos{ color:var(--orange); } .neg{ color:var(--blue); }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:21px 22px 16px; margin-top:18px; }
  .panel h2{ font-size:1rem; font-weight:700; }
  .panel .cap{ color:var(--mut); font-size:.79rem; margin-top:1px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px; align-items:start; }
  @media (max-width:840px){ .row2{ grid-template-columns:1fr; } }
  .row2 .panel{ margin-top:0; }
  .chartbox{ position:relative; margin-top:12px; }
  svg{ display:block; width:100%; height:auto; }
  .legend{ display:flex; flex-wrap:wrap; gap:15px; margin:9px 2px 4px; font-size:.79rem; color:var(--ink2); }
  .legend span{ display:inline-flex; align-items:center; gap:7px; }
  .sw{ width:16px; height:0; border-top:2.5px solid; border-radius:2px; }
  .sw.dash{ border-top-style:dashed; }
  .sw.box{ width:11px; height:11px; border:0; border-radius:3px; }

  .hbar{ margin-top:12px; }
  .hbar .r{ display:grid; grid-template-columns:104px 1fr 92px; align-items:center; gap:10px; padding:4px 0; }
  .hbar .n{ font-size:.85rem; color:var(--ink); font-weight:600; }
  .hbar .track{ height:17px; background:var(--card2); border-radius:5px; overflow:hidden; position:relative; }
  .hbar .fill{ height:100%; border-radius:4px; }
  
  .hbar .tgt{ position:absolute; top:0; bottom:0; width:2px; background:var(--ink); opacity:.5; }
  .hbar .v{ font-size:.79rem; color:var(--ink2); text-align:right; font-variant-numeric:tabular-nums; line-height:1.35; }

  .secwrap{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:26px; align-items:start; }
  @media (max-width:840px){ .secwrap{ grid-template-columns:1fr; } }
  .hbar.pick .r{ cursor:pointer; border-radius:6px; }
  .hbar.pick .r:hover{ background:var(--card2); }
  .hbar.pick .r.on .n{ color:var(--blue); }
  .hbar.pick .r:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }
  .donut{ margin-top:12px; position:relative; }
  .donut .hd{ font-size:.82rem; font-weight:700; color:var(--ink); }
  .donut .sub2{ font-size:.75rem; color:var(--mut); margin-top:1px; }
  .donut .ph{ font-size:.78rem; color:var(--mut); margin-top:10px; }
  .donut path, .donut circle{ cursor:default; }
  .donut path:hover, .donut circle:hover{ opacity:.82; }

  .note{ border-left:3px solid var(--blue); background:var(--card2); border-radius:0 10px 10px 0;
         padding:13px 17px; margin:15px 0 4px; color:var(--ink2); font-size:.9rem; }
  .note b{ color:var(--ink); }
  .note.warn{ border-left-color:var(--orange); }

  .tip{ position:absolute; pointer-events:none; background:#fff; border:1px solid var(--line);
        border-radius:8px; padding:8px 11px; font-size:.77rem; display:none; z-index:5;
        font-variant-numeric:tabular-nums; white-space:nowrap; box-shadow:0 6px 24px rgba(32,31,29,.16); }
  .tip .t{ color:var(--mut); margin-bottom:3px; }
  .tip .r{ display:flex; gap:10px; justify-content:space-between; }

  table{ width:100%; border-collapse:collapse; font-size:.84rem; margin-top:10px; font-variant-numeric:tabular-nums; }
  th{ text-align:right; color:var(--mut); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--grid); font-size:.75rem; letter-spacing:.03em; }
  th:first-child, th.l, td:first-child, td.l{ text-align:left; }
  td{ text-align:right; padding:7px 10px; border-bottom:1px solid var(--grid); color:var(--ink2); }
  td:first-child{ color:var(--ink); font-weight:600; }
  .tblwrap{ overflow-x:auto; }
  #seccontrib th, #seccontrib td{ white-space:nowrap; padding-left:6px; padding-right:6px; }
  #seccontrib th:first-child, #seccontrib td:first-child{ padding-left:10px; }
  th.sortable{ cursor:pointer; user-select:none; }
  th.sortable:hover{ color:var(--ink2); }
  th.sortable.active{ color:var(--ink); }
  th.sortable .arrow{ margin-left:4px; opacity:.4; font-size:.85em; }
  th.sortable .arrow.on{ opacity:1; color:var(--blue); font-weight:700; }
  tr.sum td{ border-top:1.5px solid var(--line); border-bottom:0; font-weight:700;
             color:var(--ink); padding-top:9px; }
  tr.on td{ background:var(--card2); }
  .mtabs{ display:flex; flex-wrap:wrap; gap:6px; margin:22px 0 2px; }
  .mtabs button{ font:inherit; font-size:.83rem; font-weight:650; color:var(--ink2);
    background:var(--card); border:1px solid var(--line); border-radius:7px;
    padding:6px 13px; cursor:pointer; font-variant-numeric:tabular-nums; }
  .mtabs button:hover{ border-color:var(--mut); }
  .mtabs button[aria-pressed="true"]{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .mtabs button:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .mtabs .n{ font-size:.72rem; opacity:.72; margin-left:5px; font-weight:600; }
  td.base{ color:var(--mut); text-align:center; }
  details{ margin-top:10px; } summary{ color:var(--mut); font-size:.79rem; cursor:pointer; }
  td.miss{ color:var(--mut); text-align:right; }
  
  #journal th, #journal td{ white-space:nowrap; }
  #journal th.memo, #journal td.memo{ white-space:normal; text-align:left;
    min-width:24ch; line-height:1.5; padding-left:18px; }
  #journal td.memo.none{ color:var(--mut); text-align:center; min-width:0; }
  footer{ color:var(--mut); font-size:.77rem; margin-top:30px; max-width:78ch; }
  footer p{ margin-top:6px; }</style>
<style>

  
  body{ --green:#3d7a53; }

  .legend span.click{ cursor:pointer; user-select:none; }

  #feed th, #feed td{ white-space:nowrap; }

  .en{ font-size:.68rem; font-weight:700; letter-spacing:.04em; color:var(--blue);

  .at2{ display:block; font-size:.75rem; color:var(--blue); margin-top:5px;

  #feed td.t a{ color:var(--mut); font-weight:500; }

</style>

      <div class="chartbox" id="pgBox"><div class="tip" id="pgTip"></div></div>
      <span class="at2" id="pgAt"></span>

      <div class="tblwrap"><table id="gAll"></table></div>
    </details>
  </section>

  <footer id="foot"></footer>
</div>

/* ── 확인이 필요한 것 ── 못 받은 소스와, 검증에서 버린 행. 안 보이면 늙은 값이

/* ══ 선차트 ══
   금리 넷·수급 셋이 전부 같은 모양이라 하나로 그린다. 값이 없는 날(null)에서는 선을
   끊는다 — 이어 버리면 없는 값을 있는 것처럼 그리게 된다.

   휠을 굴리면 커서 자리를 붙든 채 확대·축소하고, 끌면 옮기고, 더블클릭하면 되돌아간다.
   본 구간은 zoomKey별로 기억해 두므로 범례를 껐다 켜도 보던 자리가 유지되고, 기간
   토글을 바꾸면(점 개수가 달라지면) 저절로 풀린다.

   계열에 axis:'right'를 달면 오른쪽 눈금으로 따로 잰다. 수급(±수십조)과 코스피
   지수(수천 포인트)는 한 축에 못 올린다 — 예전에는 지수를 아래에 따로 떼어 그렸는데,
   그러면 같은 날을 보려고 눈이 두 번 움직여야 했다. */
const W = 1010, MIN_PTS = 8;
const ZOOM = {}, DRAG = {};
addEventListener('pointerup', ()=>{ for(const k in DRAG) delete DRAG[k]; });
function nice(x){
  if(!(x>0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(x))), f = x/e;
  return (f<=1?1:f<=2?2:f<=5?5:10)*e;
}
function drawLine(o){
  const box=document.getElementById(o.box), tip=document.getElementById(o.tip);
  box.querySelectorAll('svg').forEach(s=>s.remove());
  const key=o.zoomKey||o.box, full=o.days.length;
  let z=ZOOM[key];
  if(!z || z.n!==full) z=ZOOM[key]={i0:0, i1:Math.max(0,full-1), n:full};
  const days=o.days.slice(z.i0,z.i1+1), n=days.length;
  const H=o.h||330, m={t:14,r:o.r||78,b:26,l:o.l||56};
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`}); box.appendChild(svg);
  svg.style.touchAction='none';
  const on=o.series.filter(s=>!s.off).map(s=>({...s, pts:s.pts.slice(z.i0,z.i1+1)}));
  const vals=on.flatMap(s=>s.pts).filter(v=>v!=null);
  const zoomed = z.i0>0 || z.i1<full-1;
  const redraw = o.redraw || (()=>{});

  /* 축이 둘일 수 있다. 수급(±수십조)과 코스피 지수(수천 포인트)를 한 축에 놓으면
     지수는 바닥에 붙은 직선이 되고 수급은 아무것도 안 보인다. axis:'right'인 계열은
     오른쪽 눈금으로 따로 잰다. */
  const R = on.filter(s=>s.axis==='right'), L = on.filter(s=>s.axis!=='right');
  const hasR = R.length > 0 && R.some(s=>s.pts.some(v=>v!=null));

  if(vals.length && n>=2){
    /* 왼쪽 축이 격자를 정하고, 오른쪽 축은 같은 격자 자리에 자기 값을 적는다 —
       눈금이 서로 어긋나면 두 선을 겹쳐 놓은 의미가 없다. */
    const scale = (arr, zero) => {
      const v = arr.flatMap(s=>s.pts).filter(x=>x!=null);
      if(!v.length) return null;
      let lo=Math.min(...v), hi=Math.max(...v);
      if(zero){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
      if(lo===hi){ lo-=1; hi+=1; }
      const st=nice((hi-lo)/5);
      return {lo:Math.floor(lo/st)*st, hi:Math.ceil(hi/st)*st, step:st};
    };
    const A = scale(L.length?L:on, o.zero) || scale(on, o.zero);
    const B = hasR ? scale(R, false) : null;
    let {lo,hi,step} = A;
    const plot = v => m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo));
    const X=i=>m.l+(W-m.l-m.r)*i/(n-1);
    const Yof = s => (s.axis==='right' && B)
      ? (v => m.t+(H-m.t-m.b)*(1-(v-B.lo)/(B.hi-B.lo)))
      : plot;
    const Y = plot;
    /* 눈금 글자는 보이는 구간의 길이로 정한다 — 확대하면 저절로 날짜까지 나온다 */
    const xtick = d => n>260 ? ymd(d).slice(2,7) : md(d);

    for(let g=lo; g<=hi+step/1e6; g+=step){
      const zl = Math.abs(g) < step/1e6;
      svg.appendChild(el('line',{x1:m.l,x2:W-m.r,y1:Y(g),y2:Y(g),
        stroke:zl?'#c3c2b7':C.grid,'stroke-width':zl?1.4:1}));
      const t=el('text',{x:m.l-8,y:Y(g)+4,'text-anchor':'end',fill:C.mut,'font-size':11});
      t.textContent=o.ytick(g); svg.appendChild(t);
      if(B){                                  /* 같은 높이에 오른쪽 축의 값 */
        const f=(g-lo)/(hi-lo), rv=B.lo+f*(B.hi-B.lo);
        const t2=el('text',{x:W-m.r+8,y:Y(g)+4,'text-anchor':'start',
                            fill:R[0].col,'font-size':11});
        t2.textContent=(o.rtick||o.ytick)(rv); svg.appendChild(t2);
      }
    }
    const every=Math.max(1,Math.round(n/7));
    days.forEach((d,i)=>{ if(i%every || i>n-every/2) return;
      const t=el('text',{x:X(i),y:H-8,'text-anchor':'middle',fill:C.mut,'font-size':10.5});
      t.textContent=xtick(d); svg.appendChild(t); });

    /* 오른쪽 축 계열을 먼저 깔아 수급 선이 그 위에 오게 한다 — 겹칠 때 가려지는 쪽은
       배경으로 두는 지수여야 한다. */
    [...R, ...L].forEach(s=>{
      const Ys=Yof(s);
      let seg=[];
      const flush=()=>{ if(seg.length>1) svg.appendChild(el('polyline',{points:seg.join(' '),
        fill:'none',stroke:s.col,'stroke-width':s.w||2,'stroke-dasharray':s.dash||'',
        'stroke-linejoin':'round','stroke-linecap':'round'})); seg=[]; };
      s.pts.forEach((v,i)=>{ if(v==null){flush();return;} seg.push(X(i).toFixed(1)+','+Ys(v).toFixed(1)); });
      flush();
      /* 크게 확대해 점이 몇 개 안 남으면 선만으로는 어디가 하루인지 안 보인다 */
      if(n<=60) s.pts.forEach((v,i)=>{ if(v!=null)
        svg.appendChild(el('circle',{cx:X(i),cy:Ys(v),r:n<=25?3:2.2,fill:s.col})); });
      /* 오른쪽 축이 있으면 그 자리는 눈금이 쓴다. 계열 이름은 범례가 알려 준다. */
      let li=-1; for(let i=n-1;i>=0;i--) if(s.pts[i]!=null){li=i;break;}
      if(li>=0 && !o.noname && !B){
        const t=el('text',{x:W-m.r+6,y:Ys(s.pts[li])+4,fill:s.col,'font-size':11,'font-weight':700});
        t.textContent=s.short||s.name; svg.appendChild(t);
      }
    });

    const cross=el('line',{y1:m.t,y2:H-m.b,stroke:C.mut,'stroke-width':1,
                           'stroke-dasharray':'3 3',opacity:0});
    svg.appendChild(cross);
    svg.addEventListener('pointermove',ev=>{
      const r=svg.getBoundingClientRect();
      if(!(r.width>0)) return;
      const d=DRAG[key];
      if(d){                                   /* 끌어서 옮기는 중 — 툴팁은 접는다 */
        tip.style.display='none'; cross.setAttribute('opacity',0);
        const dxv=(ev.clientX-d.x)*W/r.width;
        const span=d.i1-d.i0;
        let i0=d.i0-Math.round(dxv*n/(W-m.l-m.r)), i1=i0+span;
        if(i0<0){i0=0;i1=span;}
        if(i1>full-1){i1=full-1;i0=i1-span;}
        if(i0!==z.i0 && Number.isFinite(i0) && Number.isFinite(i1)){
          ZOOM[key]={i0,i1,n:full}; redraw(); }
        return;
      }
      let i=Math.round(((ev.clientX-r.left)*W/r.width-m.l)/(W-m.l-m.r)*(n-1));
      i=Math.max(0,Math.min(n-1,i));
      cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i)); cross.setAttribute('opacity',1);
      tip.innerHTML = '<div class="t">'+ymd(days[i])+'</div>' + on.map(s=>
        '<div class="r"><span style="color:'+s.col+'">'+esc(s.name)+'</span>'+
        '<b>'+(s.pts[i]==null?'—':(s.fmt||o.fmt)(s.pts[i]))+'</b></div>').join('');
      tip.style.display='block';
      const bx=box.getBoundingClientRect();
      let tx=(X(i)/W)*bx.width+14; if(tx+210>bx.width) tx-=224;
      tip.style.left=Math.max(0,tx)+'px'; tip.style.top='10px';
    });
    svg.addEventListener('pointerleave',()=>{tip.style.display='none';cross.setAttribute('opacity',0);});
  }else{
    const t=el('text',{x:W/2,y:H/2,'text-anchor':'middle',fill:C.mut,'font-size':13});
    t.textContent='그릴 값이 없음'; svg.appendChild(t);
  }

  /* ── 휠로 확대·축소 · 끌어서 이동 · 더블클릭 원복 ── */
  if(full>MIN_PTS){
    box.style.cursor = zoomed ? 'grab' : 'crosshair';
    svg.addEventListener('wheel', ev=>{
      ev.preventDefault();                     /* 페이지가 같이 스크롤되면 쓸 수가 없다 */
      const r=svg.getBoundingClientRect();
      if(!(r.width>0)) return;                 /* 숨은 탭 — 폭이 0이라 나누면 NaN이 된다 */
      const fr=Math.max(0,Math.min(1,((ev.clientX-r.left)*W/r.width-m.l)/(W-m.l-m.r)));
      const span=z.i1-z.i0, anchor=z.i0+fr*span;
      let ns=Math.round(span*(ev.deltaY<0?0.75:1/0.75));
      ns=Math.max(MIN_PTS-1, Math.min(full-1, ns));
      if(ns===span) return;
      /* 커서 아래 있던 날짜가 제자리에 남도록 잡아 준다 */
      let i0=Math.round(anchor-fr*ns), i1=i0+ns;
      if(i0<0){i0=0;i1=ns;}
      if(i1>full-1){i1=full-1;i0=i1-ns;}
      if(!Number.isFinite(i0)||!Number.isFinite(i1)) return;
      ZOOM[key]={i0,i1,n:full}; redraw();
    }, {passive:false});
    svg.addEventListener('pointerdown', ev=>{
      if(!zoomed) return;                      /* 다 보이면 옮길 데가 없다 */
      DRAG[key]={x:ev.clientX, i0:z.i0, i1:z.i1};
      box.style.cursor='grabbing';
    });
    svg.addEventListener('dblclick', ()=>{ ZOOM[key]={i0:0,i1:full-1,n:full}; redraw(); });
  }
  /* 확대했으면 지금 보는 구간이 어디인지 적어 준다 — 안 적으면 축 끝만 보고
     전체를 보고 있다고 착각한다 */
  if(o.at) document.getElementById(o.at).textContent = zoomed
    ? ymd(days[0])+' ~ '+ymd(days[n-1])
    : '';
}

/* 범례. 누르면 그 선을 끄고 켠다. 시리즈 묶음을 통째로 갈아끼울 수 있게(기관 펼치기)
   배열이 아니라 그때그때 읽어 오는 함수를 받는다 — 배열을 넘기면 갈아끼울 때마다
   리스너가 하나씩 더 붙는다. */
function legend(id, get, redraw){
  const box=document.getElementById(id);
  const paint=()=>{ box.innerHTML = get().map((s,i)=>
    '<span class="click'+(s.off?' off':'')+'" data-i="'+i+'" role="button" tabindex="0">'+
    '<i class="sw'+(s.dash?' dash':'')+'" style="border-color:'+s.col+'"></i>'+esc(s.name)+'</span>').join(''); };
  const hit=e=>{
    const sp=e.target.closest('span[data-i]'); if(!sp) return;
    const series=get(), i=+sp.dataset.i;
    if(series.filter(s=>!s.off).length===1 && !series[i].off) return;  // 마지막 하나는 못 끈다
    series[i].off=!series[i].off; paint(); redraw();
  };
  box.addEventListener('click',hit);
  box.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hit(e); } });
  paint();
  return paint;
}

/* 기간 토글. 달력 기준으로 자른다 — 거래일 수로 자르면 시장마다 길이가 달라진다. */
const RANGES = [['3개월',90],['1년',365],['3년',1100],['전체',0]];
function rangeTabs(id, init, onPick){
  const box=document.getElementById(id);
  let cur=init;
  const paint=()=>{ box.innerHTML = RANGES.map(([lb,d])=>
    `<button type="button" data-d="${d}" aria-pressed="${d===cur}">${lb}</button>`).join(''); };
  box.addEventListener('click',e=>{
    const b=e.target.closest('button[data-d]'); if(!b) return;
    cur=+b.dataset.d; paint(); onPick(cur);
  });
  paint(); onPick(cur);
  return ()=>cur;
}
const cutoff = d => { if(!d) return '00000000';
  const t=new Date(); t.setDate(t.getDate()-d);
  return t.getFullYear()+String(t.getMonth()+1).padStart(2,'0')+String(t.getDate()).padStart(2,'0'); };

/* ══ 금리 ══ */
const usDays = Object.keys(D.us.days||{}).sort();
const krDays = Object.keys(D.kr.days||{}).sort();
const uCol = n => (D.us.cols||[]).indexOf(n);
const kCol = n => (D.kr.cols||[]).indexOf(n);

/* 전일 대비. 바로 앞 거래일에 값이 없을 수도 있어 있는 값까지 거슬러 올라간다. */
function lastTwo(days, table, ci){
  const at=i=>{const r=table[days[i]]; return r&&r[ci]!=null?r[ci]:null;};
  let li=-1; for(let i=days.length-1;i>=0;i--) if(at(i)!=null){li=i;break;}
  if(li<0) return null;
  let pi=-1; for(let i=li-1;i>=0;i--) if(at(i)!=null){pi=i;break;}
  return {v:at(li), prev:pi>=0?at(pi):null, day:days[li]};
}
document.getElementById('rTiles').innerHTML = [
  ['미국 T-bill 3개월', usDays, D.us.days, uCol('3M')],
  ['미국 국채 10년',    usDays, D.us.days, uCol('10Y')],
  ['미국 국채 30년',    usDays, D.us.days, uCol('30Y')],
  ['한국 국고채 3년',   krDays, D.kr.days, kCol('3Y')],
].map(([name,days,tbl,ci])=>{
  const t = ci<0 ? null : lastTwo(days,tbl,ci);
  if(!t) return `<div class="tile"><div class="k">${name}</div><div class="v">—</div>`+
                `<div class="d">아직 못 받음</div></div>`;
  const bp = t.prev==null ? null : (t.v-t.prev)*100;
  return `<div class="tile"><div class="k">${name}</div>`+
    `<div class="v">${t.v.toFixed(2)}%</div>`+
    `<div class="d">${bp==null?'전일 값 없음':`전일 ${sgn(bp,1)}bp`} · ${md(t.day)}</div></div>`;
}).join('');

const usSeries = [
  {name:'30년', short:'30Y', col:C.orange, pts:[]},
  {name:'10년', short:'10Y', col:C.blue,   pts:[]},
  {name:'T-bill 3개월', short:'3M', col:C.gray, pts:[]},
];
const krSeries = (D.kr.cols||[]).map((c,i)=>({
  name: c==='3Y'?'국고채 3년':'국고채 10년', short:c,
  col: i===0?C.blue:C.orange, ci:i, pts:[]}));

const pct2 = v => v.toFixed(2)+'%';
function drawRates(daysBack){
  const cut = cutoff(daysBack);
  const ud = usDays.filter(d=>d>=cut), kd = krDays.filter(d=>d>=cut);
  [[usSeries[0],uCol('30Y')],[usSeries[1],uCol('10Y')],[usSeries[2],uCol('3M')]]
    .forEach(([s,ci])=>{ s.pts = ud.map(d=>{const r=D.us.days[d]; return r&&ci>=0?r[ci]:null;}); });
  krSeries.forEach(s=>{ s.pts = kd.map(d=>{const r=D.kr.days[d]; return r?r[s.ci]:null;}); });
  const again = ()=>drawRates(rRange());
  drawLine({box:'usBox',tip:'usTip',at:'usAt',days:ud,series:usSeries,h:330,
            ytick:v=>v.toFixed(2), fmt:pct2, redraw:again});
  drawLine({box:'krBox',tip:'krTip',at:'krAt',days:kd,series:krSeries,h:250,
            ytick:v=>v.toFixed(2), fmt:pct2, redraw:again});
}
const rRange = rangeTabs('rRange', 365, drawRates);
legend('usLeg', ()=>usSeries, ()=>drawRates(rRange()));
legend('krLeg', ()=>krSeries, ()=>drawRates(rRange()));
document.getElementById('krCap').textContent = (D.kr.cols||[]).length>1

/* ══ 코스피 수급 ══ */
const invDays = Object.keys(D.inv.days||{}).sort();
const pgDays  = Object.keys(D.prog.days||{}).sort();
const iCol = n => (D.inv.cols||[]).indexOf(n);
const pCol = n => (D.prog.cols||[]).indexOf(n);

/* 기본은 개인·외국인·기관 셋이다. 일별 순매수는 부호가 하루걸러 뒤집히는 값이라
   여섯 선을 겹쳐 놓으면 어느 선이 누구인지 눈으로 못 가른다. 기관을 쪼개 보고 싶을
   때만 펼친다 — 그러면 연기금등·금융투자·그외와 기타법인까지 함께 나온다. */
const INV_MAIN = [
  {name:'개인',   col:C.orange, w:2.4, get:r=>r[iCol('개인')]},
  {name:'외국인', col:C.blue,   w:2.4, get:r=>r[iCol('외국인')]},

];
const INV_FULL = [
  {name:'개인',      col:C.orange, get:r=>r[iCol('개인')]},
  {name:'외국인',    col:C.blue,   get:r=>r[iCol('외국인')]},
  {name:'연기금등',  col:C.green,  get:r=>r[iCol('연기금등')]},
  {name:'금융투자',  col:C.dark,   get:r=>r[iCol('금융투자')]},
  {name:'기관 그외', col:C.blueL,  get:r=>r[iCol('기관계')]-r[iCol('연기금등')]-r[iCol('금융투자')]},
  {name:'기타법인',  col:C.gray,   get:r=>r[iCol('기타법인')]},
];
/* 코스피 지수. 순매수가 아니라 수준이라 오른쪽 눈금으로 따로 재고, 일별/누계 모드에도
   휩쓸리지 않는다(kospi 표시로 fill에서 뺀다). 배경으로 깔리도록 흐린 파선으로 둔다. */
const KOSPI_S = {name:'코스피', col:C.gray, w:1.5, dash:'5 4', axis:'right', kospi:true,
                 fmt:v=>v.toLocaleString(undefined,{maximumFractionDigits:2})};
const invPack = base => base.map(x=>({...x, pts:[]})).concat({...KOSPI_S, pts:[]});
let invDetail = false;
let invSeries = invPack(INV_MAIN);

const pgSeries = [
  {name:'비차익', col:C.blue,   get:r=>r[pCol('비차익순')]},
  {name:'차익',   col:C.orange, get:r=>r[pCol('차익순')],  off:true},
  {name:'전체',   col:C.gray,   get:r=>r[pCol('전체순')],  off:true, dash:'6 5'},
].map(s=>({...s, pts:[]}));

/* 보는 방법. 일별은 부호가 하루걸러 뒤집혀서 추세가 안 읽히므로 기본은 20일 누계다.
   5일은 한 주, 20일은 대략 한 달 — 짧은 창은 방향이 언제 바뀌었는지를 빨리 보여주고
   긴 창은 그 방향이 이어지는지를 보여준다.

   기울기·이동평균·누계는 사실 같은 것을 다르게 적은 것이다 — 누적 곡선의 기울기가
   곧 일별의 이동평균이고, N일 누계는 그 이동평균에 N을 곱한 값(억원)이다. 누계를 고른
   이유는 단위가 그대로 억원이라 "최근 한 주/한 달에 얼마 샀나"로 바로 읽히고, 누적과
   달리 시작일을 어디로 잡든 모양이 변하지 않기 때문이다.

   mode는 창의 거래일 수다. 0이면 일별, 음수면 구간 처음부터의 누적. */
let mode = 20;
const MODES = [['일별',0], ['5일 누계',5], ['20일 누계',20], ['누적',-1]];
let invLegPaint = null;
function paintFlowTabs(){
  document.getElementById('fMode').innerHTML =
    MODES.map(([lb,v])=>`<button type="button" data-m="${v}" aria-pressed="${v===mode}">${lb}</button>`).join('')+
    `<span style="width:18px"></span>`+
    `<button type="button" data-w="0" aria-pressed="${!invDetail}">개인·외국인·기관</button>`+
    `<button type="button" data-w="1" aria-pressed="${invDetail}">기관 펼쳐서</button>`;
}
document.getElementById('fMode').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.m!==undefined) mode = +b.dataset.m;
  else if(b.dataset.w!==undefined){
    const want = b.dataset.w==='1';
    if(want===invDetail) return;
    invDetail = want;
    invSeries = invPack(invDetail?INV_FULL:INV_MAIN);
    if(invLegPaint) invLegPaint();
  }
  paintFlowTabs(); drawFlows(fRange());
});

function fill(series, days, table){
  series.forEach(s=>{
    const raw = days.map(d=>{
      const r=table[d]; if(!r) return null;
      const v=s.get(r); return (v==null||isNaN(v)) ? null : v;
    });
    if(mode===0){ s.pts = raw; return; }
    if(mode<0){ let a=0; s.pts = raw.map(v=>v==null?null:(a+=v)); return; }
    s.pts = raw.map((_,i)=>{                 /* 창이 다 안 찬 앞머리는 그리지 않는다 */
      if(i<mode-1) return null;
      let sum=0;
      for(let k=i-mode+1;k<=i;k++){ if(raw[k]==null) return null; sum+=raw[k]; }
      return sum;
    });
  });
}
function drawFlows(daysBack){
  const cut = cutoff(daysBack);
  const id = invDays.filter(d=>d>=cut), pd = pgDays.filter(d=>d>=cut);
  fill(invSeries.filter(s=>!s.kospi), id, D.inv.days);
  fill(pgSeries,  pd, D.prog.days);
  /* 지수는 수급과 같은 날짜 배열을 쓴다. 값이 없는 날은 null로 두고 선을 끊는다 —
     있는 날만 골라 그리면 가로축이 어긋나 같은 자리가 서로 다른 날을 가리킨다. */
  const ks = invSeries.find(s=>s.kospi);
  if(ks) ks.pts = id.map(d=>(D.kospi&&D.kospi[d]!=null)?D.kospi[d]:null);
  const again = ()=>drawFlows(fRange());
  drawLine({box:'invBox',tip:'invTip',at:'invAt',days:id,series:invSeries,h:360,zero:true,
            zoomKey:'flows', r:96, ytick:v=>억(v/1e4)+'조', fmt:v=>억(v)+'억',
            rtick:v=>Math.round(v).toLocaleString(), redraw:again});
  drawLine({box:'pgBox',tip:'pgTip',at:'pgAt',days:pd,series:pgSeries,h:300,zero:true,
            ytick:v=>억(v/1e4)+'조', fmt:v=>억(v)+'억', redraw:again});
}
const fRange = rangeTabs('fRange', 365, drawFlows);
invLegPaint = legend('invLeg', ()=>invSeries, ()=>drawFlows(fRange()));
legend('pgLeg', ()=>pgSeries, ()=>drawFlows(fRange()));
paintFlowTabs();

/* ══ 구루 발언 ══
   여기 있는 것은 '그 사람의 말이 겹따옴표로 인용된 헤드라인'이다. 이름만 걸린 기사는
   macro.py가 걸러 낸다 — 남이 그의 책을 읽고 쓴 글이나 남이 그를 두고 한 말이 그의
   발언인 양 올라가던 것을 막으려는 것. 무슨 뜻인지는 눌러서 원문을 본다. */
const G = D.gurus || {list:[], items:[]};
const GROUPS = [...new Set((G.list||[]).map(r=>r.group).filter(Boolean))];
let gGroup='', gFind='';

/* 인용 대목만 진하게. 나머지 헤드라인은 그 말이 어떤 맥락에 실렸는지 보여주는 배경이다. */
function mark(t,q){
  const i = q ? t.indexOf(q) : -1;
  if(i<0) return esc(t);
  return esc(t.slice(0,i)) + '<b>' + esc(t.slice(i,i+q.length)) + '</b>' + esc(t.slice(i+q.length));
}

(function(){
  const box=document.getElementById('gGroups');
  const paint=()=>{ box.innerHTML = [['전체','']].concat(GROUPS.map(g=>[g,g])).map(([lb,v])=>{
    const n = v ? G.items.filter(i=>i.group===v).length : G.items.length;
    return `<button type="button" data-g="${esc(v)}" aria-pressed="${v===gGroup}">${esc(lb)}`+
           `<span class="n">${n}</span></button>`; }).join(''); };
  box.addEventListener('click',e=>{
    const b=e.target.closest('button[data-g]'); if(!b) return;
    gGroup=b.dataset.g; paint(); paintFeed();
  });
  paint();
})();
document.getElementById('gFind').addEventListener('input',e=>{
  gFind=e.target.value.trim(); paintFeed();
});

function paintFeed(){
  const rows = G.items.filter(i =>
    (!gGroup || i.group===gGroup) && (!gFind || i.name.includes(gFind)));
  document.getElementById('gCount').textContent = `${rows.length}건`;
  document.getElementById('gRows').innerHTML = rows.length ? rows.map(i=>
    `<tr><td>${md(i.d)}</td><td class="who">${esc(i.name)}</td>`+
    `<td class="src">${esc(i.src||'')}${i.en?'<span class="en">EN</span>':''}</td>`+
    `<td class="t"><a href="${esc(i.u)}" target="_blank" rel="noreferrer noopener">`+
    `${mark(i.t, i.q)}</a></td></tr>`
  ).join('') : `<tr><td class="l" colspan="4" style="color:var(--mut)">해당하는 기사가 없다</td></tr>`;
}
paintFeed();

document.getElementById('gAll').innerHTML =
  `<thead><tr><th class="l">인물</th><th class="l">분류</th><th>마지막 발언</th>`+
  `<th>최근 ${G.window||90}일</th><th>그중 영어 원문</th></tr></thead><tbody>` +
  (G.list||[]).map(r=>
    `<tr class="${r.n?'':'quiet'}"><td class="l">${esc(r.name)}</td>`+
    `<td class="l">${esc(r.group||'')}</td>`+
    `<td>${r.last?ymd(r.last):'—'}</td><td>${r.n?r.n+'건':'없음'}</td>`+
    `<td>${r.en?r.en+'건':'—'}</td></tr>`).join('') +
  `</tbody>`;

/* ── 푸터 ── */
document.getElementById('foot').innerHTML =
  `미국 국채 — 미 재무부 일별 par yield curve · 한국 국고채 — 네이버 시장지표 · `+
  `코스피 수급 — 네이버 금융 일별표(코스피, 단위 억원) · 발언 — 구글 뉴스 RSS.`+
  `<p>하루 한 번 받는다. 못 받으면 직전 값으로 그리고 그 사실이 위 배너에 뜬다.</p>`+
  ``;

/* ── 다시 받기 ──
   이 페이지도 자립형이라 안에 박힌 값을 스스로 못 바꾼다. 자산 대시보드와 같은
   refresh_server.py를 두드려 update.bat을 돌리고, 끝나면 페이지를 다시 읽는다.
   서버가 없으면 켜는 법만 알려 준다 — 서버 없이도 이 장은 그대로 열린다. */
(function(){
  const API = 'http://127.0.0.1:8765';
  const btn = document.getElementById('refresh'), at = document.getElementById('refreshat');
  if(!btn || !at) return;                  /* 밖으로 내보낸 사본에는 이 버튼이 없다 */
  at.textContent = `${D.fetched} 수집`;
  btn.addEventListener('click', async ()=>{
    const before = at.textContent;
    btn.disabled = true; btn.textContent = '받는 중…';
    at.classList.remove('err'); at.textContent = '다시 받아 만드는 중 — 1분쯤 걸림';
    try{
      const r = await fetch(API+'/refresh', {method:'POST'});
      const j = await r.json().catch(()=>({}));
      if(!j.ok) throw new Error(j.error || '빌드가 실패했습니다. refresh-server 창을 확인하세요.');
      location.reload();
    }catch(e){
      btn.disabled = false; btn.textContent = '다시 받기';
      at.classList.add('err');
      at.textContent = (e instanceof TypeError)
        ? '새로고침 서버가 꺼져 있음 — refresh-server.bat을 실행한 뒤 다시 누르세요'
        : e.message;
      setTimeout(()=>{ at.classList.remove('err'); at.textContent = before; }, 12000);
    }
  });
})();
</script>
